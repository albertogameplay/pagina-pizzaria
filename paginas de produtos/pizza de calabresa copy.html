<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: rgb(247, 247, 144);
        color: white;
      }

      main {
        min-height: calc(100vh - 100px);
      }

      header {
        background-color: rgb(210, 16, 16);
        display: flex;
        height: 195px;
        flex-direction: column;
      }

      .logo {
        border-radius: 50%;
        width: 150px;
        height: 150px;
        object-fit: cover;
        align-self: flex-start;
      }

      .botao {
        background-color: rgb(210, 16, 16);
        color: rgb(247, 247, 144);
        border: none;
        text-decoration: underline;
        font-size: 25px;
        cursor: pointer;
        margin-bottom: 15px;
        margin-left: 50px;
      }

      .botoes {
        display: flex;
        justify-content: left;
        gap: 40px;
        width: 100%;
      }

      .nome {
        font-size: 50px;
        margin-top: 10px;
      }

      .descrição {
        font-size: 40px;
      }

      .div-produto {
        background-color: white;
        color: black;
        width: 1050px;
        height: 1270px;
        border-radius: 5%;
        margin-top: 22px;
        margin-bottom: 22px;
      }

      .buton {
        background-color: rgb(210, 16, 16);
        width: 1000px;
        height: 170px;
        color: white;
        font-size: 40px;
        border-radius: 170px;
      }

      .buton-carrinho {
        background-color: rgb(47, 167, 11);
        width: 1000px;
        height: 170px;
        color: white;
        font-size: 40px;
        margin-top: 15px;
        border-radius: 170px;
      }
    </style>
  </head>

  <body>
    <header>
      <img src="../imagens/Logo Pizzaria Fast Pizza.png" class="logo" />
      <div class="botoes">
        <a href="../Principal.html"> <button class="botao">voltar</button> </a>
      </div>
    </header>
    <main class="d-flex justify-content-center align-items-center">
      <div
        class="div-produto d-flex flex-column align-items-center text-center"
      >
        <div class="produto">
          <img
            src="../imagens/pizza1.png"
            class="nome"
            width="600px"
            height="600px"
          />

          <p class="nome">Pizza de Calabresa</p>
          <p class="descrição">
            Descrição: Queijo mussarela, calabresa e cebola.
          </p>
          <p class="descrição">Preço: R$ 35,00</p>
          <a href="../pag_pagamento.html">
            <button class="btn btn-lg fw-bold shadow px-5 py-2 fs-4 buton">
              Comprar Agora
            </button>
          </a>
          <a href="../sacola.html">
            <button
              class="btn btn-lg fw-bold shadow px-5 py-2 fs-4 buton-carrinho"
            >
              Adicionar à sacola
            </button>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
