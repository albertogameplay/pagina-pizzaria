<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: rgb(247, 247, 144);
        color: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      header {
        background-color: rgb(210, 16, 16);
        width: 100%;
        height: 195px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      footer {
        background-color: rgb(210, 16, 16);
        width: 100%;
        height: 100px;
        margin-top: auto;
      }

      .container-principal {
        background-color: rgb(210, 16, 16);
        width: 80%;
        max-width: 900px;
        padding: 30px;
        border-radius: 16px;
        text-align: center;
        margin-top: 40px;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 48px;
        font-weight: 500;
        color: white;
        margin: 0;
      }

      label {
        font-size: 20px;
        color: white;
      }

      button {
        height: 44px;
        width: 50%;
        border-radius: 8px;
        border: none;
        background-color: rgb(239, 237, 237);
        font-size: 20px;
        font-weight: bold;
        color: black;
      }

      .voltar {
        position: absolute;
        left: 50px;
        background-color: rgb(247, 247, 144);
        color: rgb(210, 16, 16);
        border: none;
        border-radius: 10px;
        width: 120px;
        height: 50px;
        font-size: 20px;
        cursor: pointer;
      }
      .botao {
        position: absolute;
        left: 50px;
        bottom: 20px;
        background-color: rgb(210, 16, 16);
        color: rgb(247, 247, 144);
        border: none;
        text-decoration: underline;
        font-size: 25px;
        cursor: pointer;
        width: auto;
        height: auto;
      }
    </style>
  </head>

  <body>
    <header>
      <a href="./Principal.html">
        <button class="botao">Voltar</button>
      </a>

      <h1>Pagamento e Dados da entrega</h1>
    </header>

    <div class="container-principal">
      <form class="row g-3 text-start" action="" method="get">
        <div class="col-12">
          <label for="inputNome" class="form-label">Nome Completo</label>
          <input
            type="text"
            class="form-control"
            id="inputNome"
            placeholder="Seu nome"
            required
          />
        </div>

        <div class="col-md-9">
          <label for="inputRua" class="form-label">Rua</label>
          <input
            type="text"
            class="form-control"
            id="inputRua"
            placeholder="Nome da rua ou avenida"
            required
          />
        </div>

        <div class="col-md-3">
          <label for="inputNumero" class="form-label">Número</label>
          <input
            type="text"
            class="form-control"
            id="inputNumero"
            placeholder="123"
            required
          />
        </div>

        <div class="col-12">
          <label for="inputBairro" class="form-label">Bairro</label>
          <input
            type="text"
            class="form-control"
            id="inputBairro"
            placeholder="Seu bairro"
            required
          />
        </div>

        <div class="col-12">
          <label for="inputPagamento" class="form-label"
            >Forma de Pagamento</label
          >
          <select id="inputPagamento" class="form-select">
            <option selected>
              Selecione a forma de pagamento (pagamento feito no ato da entrega)
            </option>
            <option value="pix">PIX</option>
            <option value="cartao">Cartão</option>
            <option value="dinheiro">Dinheiro</option>
          </select>
        </div>

        <div class="col-12 text-center mt-4">
          <button type="submit">Finalizar Pedido</button>
        </div>
      </form>
    </div>

    <footer></footer>
  </body>
</html>
