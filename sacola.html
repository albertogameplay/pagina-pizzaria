<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sacola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: rgb(247, 247, 144);
        color: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      header {
        background-color: rgb(210, 16, 16);
        width: 100%;
        height: 195px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      footer {
        background-color: rgb(210, 16, 16);
        width: 100%;
        height: 100px;
        margin-top: auto;
      }

      .container-principal {
        background-color: rgb(210, 16, 16);
        max-width: 100%;
        width: 80%;
        padding: 30px;
        border-radius: 16px;
        text-align: center;
        margin-top: 40px;
        margin-bottom: 40px;
      }

      h1 {
        font-size: 64px;
        font-weight: 500;
        color: white;
        margin: 0;
      }

      p {
        font-size: 24px;
        color: white;
      }

      .imgs {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 30px;
      }

      .figure {
        width: 300px;
      }

      button {
        height: 64px;
        width: 30%;
        border-radius: 32px;
        border: none;
        background-color: rgb(239, 237, 237);
      }

      .botao {
        position: absolute;
        bottom: 5px;
        left: 10px;
        width: auto;
        height: auto;
        background-color: rgb(210, 16, 16);
        color: rgb(247, 247, 144);
        border: none;
        text-decoration: underline;
        font-size: 25px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Sacola</h1>
      <div class="botoes">
        <a href="../Principal.html">
          <button class="botao">voltar</button>
        </a>
      </div>
    </header>

    <div class="container-principal">
      <div class="imgs">
        <figure class="figure">
          <img
            src="./imagens/coca.png"
            class="img-fluid rounded-3"
            alt="Coca Cola"
          />
          <figcaption
            class="figure-caption"
            style="color: white; font-size: 20px; text-align: left"
          >
            Preço: R$10,00 <br />
            Data da compra: 11/07/2026
          </figcaption>
        </figure>

        <figure class="figure">
          <img
            src="./imagens/Batata_frita.webp"
            class="img-fluid rounded-3"
            alt="Batata Frita"
          />
          <figcaption
            class="figure-caption"
            style="color: white; font-size: 20px; text-align: left"
          >
            Preço: R$15,00 <br />
            Data da compra: 11/07/2026
          </figcaption>
        </figure>

        <figure class="figure">
          <img
            src="./imagens/pizza4.webp"
            class="img-fluid rounded-3"
            alt="Pizza"
          />
          <figcaption
            class="figure-caption"
            style="color: white; font-size: 20px; text-align: left"
          >
            Preço: R$42,00 <br />
            Data da compra: 11/07/2026
          </figcaption>
        </figure>
      </div>

      <br />
      <br />

      <form action="pag_pagamento.html" method="get">
        <button type="submit">Ir para o pagamento</button>
      </form>
    </div>

    <footer></footer>
  </body>
</html>
