<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      body {
        font-family: "Roboto", sans-serif;
        background-color: rgb(247, 247, 144);
        color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }

      .container-principal {
        background-color: rgb(210, 16, 16);
        width: 400px;
        padding: 20px;
        border-radius: 16px;
        text-align: center;
        margin-top: 230px;
      }
      span {
        font-size: 48px;
        font-weight: 500;
        color: white;
      }

      button {
        height: 32px;
        width: 50%;
        border-radius: 8px;
        border: none;
        background-color: rgb(239, 237, 237);
      }
    </style>
  </head>
  <body>
    <div class="container-principal">
      <span>Login</span>
      <br />
      <form action="principal.html" method="get">
        <div class="mb-3 text-start">
          <label for="email" class="form-label text-white">E-mail</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="nome@exemplo.com"
          />
        </div>
        <div class="mb-3 text-start">
          <label for="password" class="form-label text-white">Senha</label>
          <input
            type="password"
            class="form-control"
            id="password"
            placeholder="Insira sua senha"
          />
          <div class="strength" data-bs-strength>
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
            <div class="strength-segment"></div>
          </div>
          <div id="emailHelp" class="form-text text-white">
            Nunca compartilharemos seu e-mail ou senha com mais ninguém.
          </div>
        </div>
        <br />
        <br />
        <button type="submit">Entrar</button>
      </form>
    </div>
  </body>
</html>
